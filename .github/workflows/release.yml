name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync package version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - run: npm run package:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installers/Career Genie-Setup-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync package version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - run: npm run package:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/installers/career-genie_*_amd64.deb
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Career Genie-Setup-*.exe
            artifacts/career-genie_*_amd64.deb
          generate_release_notes: true
